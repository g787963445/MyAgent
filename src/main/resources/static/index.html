<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MyAgent</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<main class="app-shell">
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-mark">MA</div>
            <div>
                <h1>MyAgent</h1>
                <p>Java 项目编程助手</p>
            </div>
        </div>

        <section class="panel">
            <label>项目路径</label>
            <div id="projectPath" class="selected-path">正在加载工作区...</div>
            <button id="chooseProjectButton" class="secondary-button" type="button" title="选择项目目录">选择项目</button>
        </section>

        <section class="panel">
            <label>对话模式</label>
            <div class="mode-toggle">
                <button id="chatModeButton" class="mode-button active" type="button">普通问答</button>
                <button id="planModeButton" class="mode-button" type="button">修改方案</button>
            </div>
        </section>

        <section class="panel">
            <label for="fileSearch">搜索文件</label>
            <input id="fileSearch" type="text" placeholder="Controller、service、yaml...">
            <ul id="fileResults" class="file-results">
                <li class="muted">输入关键字搜索文件</li>
            </ul>
        </section>

        <section class="panel">
            <label>会话编号</label>
            <div id="sessionId" class="session-id"></div>
        </section>

        <section class="panel files-panel">
            <div class="panel-title">本次引用文件</div>
            <ul id="usedFiles" class="used-files">
                <li class="muted">暂无引用文件</li>
            </ul>
        </section>

        <section class="safety-note">
            <strong>私人助手模式</strong>
            <span>选中的项目文件、环境变量和配置文件可能会发送给 DeepSeek。证书和私钥文件默认跳过。</span>
        </section>

        <button id="clearButton" class="secondary-button" type="button" title="清空当前会话">清空会话</button>
    </aside>

    <section class="chat-area">
        <header class="chat-header">
            <div>
                <h2>代码助手对话</h2>
                <p id="statusText">就绪</p>
            </div>
        </header>

        <div id="messages" class="messages" aria-live="polite"></div>

        <form id="chatForm" class="composer">
            <textarea id="question" rows="3" placeholder="请输入你想问的 Java 项目问题..." required></textarea>
            <button id="sendButton" class="send-button" type="submit" title="发送">发送</button>
        </form>
    </section>
</main>

<div id="pathDialog" class="dialog-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="pathDialogTitle">
    <section class="dialog">
        <header class="dialog-header">
            <div>
                <h2 id="pathDialogTitle">选择项目目录</h2>
                <p id="browserRoot">工作区</p>
            </div>
            <button id="closeDialogButton" class="icon-button" type="button" title="关闭">×</button>
        </header>

        <div class="current-folder">
            <span>当前目录</span>
            <strong id="currentFolder"></strong>
        </div>

        <div class="dialog-actions">
            <button id="parentButton" class="secondary-button" type="button">上一级</button>
            <button id="selectCurrentButton" class="send-button" type="button">使用当前目录</button>
        </div>

        <ul id="directoryList" class="directory-list"></ul>
    </section>
</div>

<div id="fileDialog" class="dialog-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="fileDialogTitle">
    <section class="dialog file-dialog">
        <header class="dialog-header">
            <div>
                <h2 id="fileDialogTitle">文件预览</h2>
                <p id="fileDialogPath"></p>
            </div>
            <button id="closeFileDialogButton" class="icon-button" type="button" title="关闭">×</button>
        </header>
        <pre id="fileContent" class="file-content"></pre>
    </section>
</div>

<script src="/app.js"></script>
</body>
</html>
