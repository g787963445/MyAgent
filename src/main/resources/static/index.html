<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MyAgent</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<main class="app-shell">
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-mark">MA</div>
            <div>
                <h1>MyAgent</h1>
                <p>Java Project Assistant</p>
            </div>
        </div>

        <section class="panel">
            <label>Project</label>
            <div id="projectPath" class="selected-path">Loading workspace...</div>
            <button id="chooseProjectButton" class="secondary-button" type="button" title="Choose project folder">Choose</button>
        </section>

        <section class="panel">
            <label>Session</label>
            <div id="sessionId" class="session-id"></div>
        </section>

        <section class="panel files-panel">
            <div class="panel-title">Used Files</div>
            <ul id="usedFiles" class="used-files">
                <li class="muted">No files yet</li>
            </ul>
        </section>

        <button id="clearButton" class="secondary-button" type="button" title="Clear conversation">Clear</button>
    </aside>

    <section class="chat-area">
        <header class="chat-header">
            <div>
                <h2>Code Chat</h2>
                <p id="statusText">Ready</p>
            </div>
        </header>

        <div id="messages" class="messages" aria-live="polite"></div>

        <form id="chatForm" class="composer">
            <textarea id="question" rows="3" placeholder="Ask about this Java project..." required></textarea>
            <button id="sendButton" class="send-button" type="submit" title="Send">Send</button>
        </form>
    </section>
</main>

<div id="pathDialog" class="dialog-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="pathDialogTitle">
    <section class="dialog">
        <header class="dialog-header">
            <div>
                <h2 id="pathDialogTitle">Choose Project</h2>
                <p id="browserRoot">Workspace</p>
            </div>
            <button id="closeDialogButton" class="icon-button" type="button" title="Close">×</button>
        </header>

        <div class="current-folder">
            <span>Current</span>
            <strong id="currentFolder"></strong>
        </div>

        <div class="dialog-actions">
            <button id="parentButton" class="secondary-button" type="button">Up</button>
            <button id="selectCurrentButton" class="send-button" type="button">Use This Folder</button>
        </div>

        <ul id="directoryList" class="directory-list"></ul>
    </section>
</div>

<script src="/app.js"></script>
</body>
</html>
